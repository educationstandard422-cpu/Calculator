name: Build Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Create Python virtual environment
        run: |
          python -m venv buildenv
          source buildenv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer \
            cython==0.29.37

      - name: Configure virtual environment
        run: |
          source buildenv/bin/activate

          # Make the virtual environment able to see system packages.
          # This avoids the Buildozer --user/pip conflict.
          VENV_CFG="buildenv/pyvenv.cfg"

          if grep -q "^include-system-site-packages" "$VENV_CFG"; then
            sed -i \
              's/^include-system-site-packages.*/include-system-site-packages = true/' \
              "$VENV_CFG"
          else
            echo "include-system-site-packages = true" >> "$VENV_CFG"
          fi

          cat "$VENV_CFG"

      - name: Check Python
        run: |
          source buildenv/bin/activate
          python --version
          pip --version
          buildozer --version

      - name: Build Calculator APK
        env:
          PIP_USER: "0"
        run: |
          source buildenv/bin/activate

          export PIP_USER=0
          export PIP_NO_USER_CONFIG=1

          buildozer android debug

      - name: Upload Calculator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: |
            bin/*.apk

name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3 python3-venv python3-pip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Extract Calculator project
        run: |
          unzip -q Calculator_Android_Project.zip -d project

      - name: Create Python virtual environment
        run: |
          python3 -m venv buildenv
          buildenv/bin/python -m pip install --upgrade pip setuptools wheel
          buildenv/bin/pip install "Cython<3.0" buildozer

      - name: Check Cython
        run: |
          export PATH="$GITHUB_WORKSPACE/buildenv/bin:$PATH"
          cython --version
          buildozer --version

      - name: Build Calculator APK
        working-directory: project/Calculator
        run: |
          export PATH="$GITHUB_WORKSPACE/buildenv/bin:$PATH"
          cython --version
          buildozer android debug

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: project/Calculator/bin/*.apk
          if-no-files-found: error

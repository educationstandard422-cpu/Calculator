name: Build Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Repository download
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install system packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 4. Install Python packages
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer
          python -m pip install --user "Cython==0.29.37"

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 5. Check files
      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Buildozer version:"
          buildozer --version

          echo "Python version:"
          python --version

      # 6. Build APK
      - name: Build Calculator APK
        run: |
          buildozer android debug

      # 7. Upload APK
      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: |
            bin/*.apk
          if-no-files-found: error

name: Build Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            ant

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user buildozer
          pip install --user Cython==0.29.37
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses Manually & Build
        run: |
          # Android command-line tools ડાઉનલોડ કરીને લાયસન્સ ઓટો-એકસેપ્ટ કરવા માટે
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Buildozer ને રન કરો જેથી તે ડાઉનલોડ શરૂ કરે, અને લાયસન્સ ફોર્સફુલી પાસ કરો
          yes | buildozer android debug || true
          
          # જો SDK બન્યા પછી પણ લાયસન્સ બાકી હોય તો તેને ફિક્સ કરવા માટે
          if [ -d "$ANDROID_HOME" ]; then
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi
          
          # ફાઇનલી ફરીથી બિલ્ડ રન કરો
          buildozer android debug

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
          

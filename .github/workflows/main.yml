name: Build Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5:i386 \
            libstdc++6:i386 \
            libz1:i386 \
            libffi-dev \
            libssl-dev \
            ant

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user buildozer
          pip install --user Cython==0.29.37
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Android Command-Line Tools Manually
        run: |
          # SDK અને cmdline-tools માટે જરૂરી ફોલ્ડર બનાવો
          ANDROID_SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK/cmdline-tools
          
          # સત્તાવાર Android command-line tools ડાઉનલોડ કરો
          echo "Downloading command-line tools..."
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          
          # અનઝિપ કરો અને સાચા ફોલ્ડર (latest) માં મૂકો
          unzip -q commandlinetools.zip -d $ANDROID_SDK/cmdline-tools
          mv $ANDROID_SDK/cmdline-tools/cmdline-tools $ANDROID_SDK/cmdline-tools/latest
          
          # લાયસન્સ ફાઇલો પહેલેથી જ ક્રિએટ કરી દો
          mkdir -p $ANDROID_SDK/licenses
          echo "24333f8a43b682ff23c510562b82a21fb15f206f" > $ANDROID_SDK/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_SDK/licenses/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
          
